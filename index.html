<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b32"><link rel="manifest" href="manifest.json"><title>SAFETY360</title>
<style>
:root{--green:#123b32;--lime:#c5e86c;--bg:#f3f6f4;--ink:#15221e;--muted:#65756e;--card:white;--line:#dce5df}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--green);color:white;padding:20px 18px 16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px;letter-spacing:.5px}header small{color:#d3e6dc}.wrap{max-width:900px;margin:auto;padding:14px 14px 90px}.nav{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}.nav button{white-space:nowrap;border:0;background:#e1eae5;padding:10px 14px;border-radius:20px;font-weight:650;color:var(--green)}.nav button.active{background:var(--green);color:white}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 8px #123b3208}.metric{font-size:28px;font-weight:800;color:var(--green)}.label{font-size:13px;color:var(--muted)}h2{font-size:19px;margin:12px 0}form{background:white;border:1px solid var(--line);padding:14px;border-radius:16px;margin:10px 0}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #cbd7d0;border-radius:10px;background:white}textarea{min-height:80px}button.primary{background:var(--green);color:white;border:0;padding:12px 16px;border-radius:11px;font-weight:700;width:100%;margin-top:12px}button.secondary{border:1px solid var(--line);background:white;padding:9px 12px;border-radius:10px;font-weight:600}.item{background:white;border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0}.item strong{display:block}.status{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;background:#fff0cb;color:#765300;margin-top:5px}.green{background:#dff4e6;color:#145b32}.red{background:#ffe3e3;color:#8c2020}.hidden{display:none!important}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1;min-width:130px}.note{font-size:12px;color:var(--muted);line-height:1.5}.photoPreview{max-width:100%;max-height:180px;border-radius:8px;margin-top:8px}.checkrow{display:flex;gap:10px;align-items:center;margin:10px 0}.checkrow input{width:auto}
</style></head><body>
<header><h1>🦺 SAFETY360</h1><small>Construction Safety Management • Mobile Prototype</small></header>
<div class="wrap">
<div class="nav" id="nav"></div>
<section id="dashboard"></section>
<section id="permits" class="hidden"></section>
<section id="observations" class="hidden"></section>
<section id="tbt" class="hidden"></section>
<section id="incidents" class="hidden"></section>
<section id="checklists" class="hidden"></section>
<section id="reports" class="hidden"></section>
</div>
<script>
const tabs=[['dashboard','Dashboard'],['permits','Work Permit'],['observations','Observation'],['tbt','TBT'],['incidents','Incident'],['checklists','Checklist'],['reports','Reports']];
let db=JSON.parse(localStorage.getItem('safety360_db')||'{"permits":[],"observations":[],"tbt":[],"incidents":[],"checks":[]}');
let tab='dashboard';let photoData='';
const save=()=>localStorage.setItem('safety360_db',JSON.stringify(db));
function nav(){document.getElementById('nav').innerHTML=tabs.map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="show('${id}')">${n}</button>`).join('')}
function show(id){tab=id;tabs.forEach(([x])=>document.getElementById(x).classList.toggle('hidden',x!==id));nav();render()}
function count(k){return db[k].length}
function dashboard(){let pending=db.permits.filter(x=>x.status==='Pending').length,open=db.observations.filter(x=>x.status!=='Closed').length;
document.getElementById('dashboard').innerHTML=`<h2>Site Safety Dashboard</h2><div class="cards"><div class="card"><div class="metric">${count('permits')}</div><div class="label">Total Permits</div></div><div class="card"><div class="metric">${pending}</div><div class="label">Pending Permits</div></div><div class="card"><div class="metric">${count('observations')}</div><div class="label">Safety Observations</div></div><div class="card"><div class="metric">${open}</div><div class="label">Open Observations</div></div><div class="card"><div class="metric">${count('tbt')}</div><div class="label">TBT Meetings</div></div><div class="card"><div class="metric">${count('incidents')}</div><div class="label">Incidents / Near Miss</div></div></div><h2>Quick Actions</h2><div class="toolbar"><button class="secondary" onclick="show('permits')">＋ New Permit</button><button class="secondary" onclick="show('observations')">＋ Observation</button><button class="secondary" onclick="show('incidents')">＋ Incident</button></div><p class="note">Prototype data is saved on this device/browser only. Back up regularly from Reports.</p>`}
function list(k){return db[k].slice().reverse().map(x=>`<div class="item"><strong>${esc(x.title||x.type||x.topic||'Record')}</strong><small>${esc(x.date||'')} • ${esc(x.location||'')}</small><div class="status ${x.status==='Approved'||x.status==='Closed'?'green':x.status==='Rejected'?'red':''}">${esc(x.status||'Recorded')}</div>${x.photo?`<img class="photoPreview" src="${x.photo}">`:''}${x.attachmentData?`<p>📎 <a href="${x.attachmentData}" download="${esc(x.attachmentName||'TBT-attachment')}">${esc(x.attachmentName||'Download attachment')}</a></p>`:''}<p>${esc(x.details||x.hazards||x.action||'')}</p><button class="secondary" onclick="del('${k}','${x.id}')">Delete</button></div>`).join('')||'<p class="note">No records yet.</p>'}
function permit(){document.getElementById('permits').innerHTML=`<h2>Work Permit</h2><form onsubmit="addPermit(event)"><label>Permit Type</label><select name="type" required><option>Work at Height</option><option>Hot Work</option><option>Electrical Work</option><option>Excavation</option><option>Confined Space</option><option>General Work</option></select><label>Project / Site</label><input name="site" placeholder="Site / project name"><label>Location</label><input name="location" required placeholder="Tower, floor, area"><label>Contractor</label><input name="contractor"><label>Work description</label><textarea name="details" required></textarea><label>Hazards</label><textarea name="hazards" placeholder="Fall, fire, electric shock..."></textarea><label>Permit date</label><input name="date" type="date" value="${today()}" required><label>Start time</label><input name="start" type="time"><label>End time</label><input name="end" type="time"><label>Permit checklist</label>${['PPE checked','Work area barricaded','Tool inspection completed','Emergency arrangements available','Supervisor briefed'].map((s,i)=>`<div class="checkrow"><input type="checkbox" name="c${i}"><span>${s}</span></div>`).join('')}<button class="primary">Save Permit (Pending Approval)</button></form><h2>Saved Permits</h2>${list('permits')}`}
function addPermit(e){e.preventDefault();let f=new FormData(e.target);db.permits.push({id:uid(),title:f.get('type'),type:f.get('type'),site:f.get('site'),location:f.get('location'),contractor:f.get('contractor'),details:f.get('details'),hazards:f.get('hazards'),date:f.get('date'),start:f.get('start'),end:f.get('end'),checks:[0,1,2,3,4].map(i=>f.get('c'+i)==='on'),status:'Pending',created:new Date().toISOString()});save();e.target.reset();show('permits')}
function observation(){document.getElementById('observations').innerHTML=`<h2>Safety Observation</h2><form onsubmit="addObs(event)"><label>Observation Type</label><select name="type"><option>Unsafe Act</option><option>Unsafe Condition</option><option>Good Practice</option><option>Near Miss</option></select><label>Location</label><input name="location" required><label>Observed by</label><input name="observer"><label>Risk level</label><select name="risk"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select><label>Description</label><textarea name="details" required></textarea><label>Corrective action</label><textarea name="action"></textarea><label>Photo (camera/gallery)</label><input type="file" accept="image/*" capture="environment" onchange="photo(event)"><div id="photo"></div><button class="primary">Save Observation</button></form><h2>Records</h2>${list('observations')}`}
function photo(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{photoData=r.result;document.getElementById('photo').innerHTML=`<img class="photoPreview" src="${photoData}">`};r.readAsDataURL(file)}
function addObs(e){e.preventDefault();let f=new FormData(e.target);db.observations.push({id:uid(),title:f.get('type'),type:f.get('type'),location:f.get('location'),observer:f.get('observer'),risk:f.get('risk'),details:f.get('details'),action:f.get('action'),photo:photoData,status:'Open',date:today()});photoData='';save();show('observations')}
function tbt(){document.getElementById('tbt').innerHTML=`<h2>Toolbox Talk (TBT)</h2><form onsubmit="addTbt(event)"><label>Topic</label><input name="topic" required placeholder="Today's safety topic"><label>Location</label><input name="location"><label>Conducted by</label><input name="conductor"><label>Date</label><input type="date" name="date" value="${today()}"><label>Attendance count</label><input type="number" min="0" name="attendance" value="0"><label>Key points discussed</label><textarea name="details"></textarea><label>Upload TBT file (PDF / photo / Word / Excel)</label><input name="attachment" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx,.txt"><p class="note">Attach TBT presentation, attendance sheet, signed record, or safety document. Keep file under 3 MB for reliable local saving.</p><button class="primary">Save TBT</button></form><h2>Records</h2>${list('tbt')}`}
async function addTbt(e){e.preventDefault();let f=new FormData(e.target),file=e.target.elements.attachment.files[0],attachmentData='',attachmentName='';if(file){if(file.size>3*1024*1024){alert('File 3 MB पेक्षा मोठी आहे. कृपया लहान file निवडा.');return}attachmentName=file.name;attachmentData=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}db.tbt.push({id:uid(),topic:f.get('topic'),title:f.get('topic'),location:f.get('location'),conductor:f.get('conductor'),date:f.get('date'),attendance:f.get('attendance'),details:f.get('details'),attachmentName,attachmentData,status:'Completed'});save();show('tbt')}
function incident(){document.getElementById('incidents').innerHTML=`<h2>Incident / Near Miss Report</h2><form onsubmit="addIncident(event)"><label>Type</label><select name="type"><option>Near Miss</option><option>Injury</option><option>Property Damage</option><option>Fire</option><option>Electrical Incident</option></select><label>Date & time</label><input name="date" type="datetime-local" required><label>Location</label><input name="location" required><label>Person involved / witness</label><input name="person"><label>Description</label><textarea name="details" required></textarea><label>Immediate action</label><textarea name="action"></textarea><label>Photo</label><input type="file" accept="image/*" capture="environment" onchange="photo(event)"><div id="photo"></div><button class="primary">Save Incident</button></form><h2>Records</h2>${list('incidents')}`}
function addIncident(e){e.preventDefault();let f=new FormData(e.target);db.incidents.push({id:uid(),title:f.get('type'),type:f.get('type'),date:f.get('date'),location:f.get('location'),person:f.get('person'),details:f.get('details'),action:f.get('action'),photo:photoData,status:'Reported'});photoData='';save();show('incidents')}
function checklist(){document.getElementById('checklists').innerHTML=`<h2>Site Safety Checklist</h2><form onsubmit="addCheck(event)"><label>Inspection category</label><select name="category"><option>Work at Height</option><option>Electrical Safety</option><option>Housekeeping</option><option>Fire Safety</option><option>Scaffolding</option><option>Lifting Operations</option><option>Excavation</option></select><label>Location</label><input name="location" required><label>Inspector</label><input name="inspector"><label>Date</label><input name="date" type="date" value="${today()}"><h3>Items</h3>${['Safe access provided','PPE used correctly','Area barricaded / signage','Equipment inspected','Housekeeping satisfactory','Emergency readiness checked'].map((s,i)=>`<div class="checkrow"><input type="checkbox" name="c${i}"><span>${s}</span></div>`).join('')}<label>Findings / remarks</label><textarea name="details"></textarea><button class="primary">Save Checklist</button></form><h2>Saved Checklists</h2>${list('checks')}`}
function addCheck(e){e.preventDefault();let f=new FormData(e.target);db.checks.push({id:uid(),title:f.get('category'),type:f.get('category'),location:f.get('location'),inspector:f.get('inspector'),date:f.get('date'),checks:[0,1,2,3,4,5].map(i=>f.get('c'+i)==='on'),details:f.get('details'),status:'Recorded'});save();show('checklists')}
function reports(){document.getElementById('reports').innerHTML=`<h2>Reports & Backup</h2><div class="card"><p>Download all prototype records as a JSON backup.</p><button class="primary" onclick="backup()">Download JSON Backup</button></div><div class="card"><p>Download selected module records as CSV for Excel.</p><select id="csvType"><option value="permits">Permits</option><option value="observations">Observations</option><option value="tbt">TBT</option><option value="incidents">Incidents</option><option value="checks">Checklists</option></select><button class="primary" onclick="csv()">Download CSV</button></div><div class="card"><p>Clear data stored on this device. Download backup first.</p><button class="secondary" onclick="clearData()">Clear All Records</button></div><p class="note">Local-only prototype: no central cloud syncing, user accounts, automatic approval alerts, or server backups. Do not store sensitive personal/medical information.</p>`}
function backup(){download('SAFETY360-backup.json',JSON.stringify(db,null,2),'application/json')}
function csv(){let k=document.getElementById('csvType').value,rows=db[k];let keys=[...new Set(rows.flatMap(o=>Object.keys(o)))];let val=x=>'"'+String(x??'').replaceAll('"','""')+'"';download('SAFETY360-'+k+'.csv',[keys.join(','),...rows.map(o=>keys.map(a=>val(typeof o[a]==='object'?JSON.stringify(o[a]):o[a])).join(','))].join('\n'),'text/csv')}
function download(n,c,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function clearData(){if(confirm('सर्व स्थानिक डेटा delete करायचा? आधी backup घ्या.')){db={permits:[],observations:[],tbt:[],incidents:[],checks:[]};save();render()}}
function del(k,id){if(confirm('हा record delete करायचा?')){db[k]=db[k].filter(x=>x.id!==id);save();render()}}
function render(){if(tab==='dashboard')dashboard();if(tab==='permits')permit();if(tab==='observations')observation();if(tab==='tbt')tbt();if(tab==='incidents')incident();if(tab==='checklists')checklist();if(tab==='reports')reports()}
function today(){return new Date().toISOString().slice(0,10)}function uid(){return 'S360-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
nav();render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
